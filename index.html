.keypad{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));
  z-index:90;width:min(420px,calc(100% - 24px));

  padding:8px 10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.16);

}

}

}

.keypad-resize{
  position:absolute;right:2px;bottom:2px;width:28px;height:28px;

}
.keypad-resize:before,.keypad-resize:after{
  content:"";position:absolute;right:6px;bottom:6px;border-radius:2px;
  border-right:2px solid #aaa19a;border-bottom:2px solid #aaa19a;
}
.keypad-resize:before{width:13px;height:13px}
.keypad-resize:after{width:7px;height:7px;right:10px;bottom:10px}

    }else if(/^\d$/.test(key)){const x=insertAtCursor(v,numberCursor,key);v=x.value;numberCursor=x.cursor}

  if(!activeMeasureInput||!activeMeasureModel)return;

      }
    }
    return;
  }

  let ch=null;
  if(key==="-"){
    if(!v.includes("-")&&v.length)ch="-";
  }else if(key==="*"){
    if(v.length)ch="*";
  }else if(key==="."){
    const before=v.slice(0,numberCursor),segment=before.includes("-")?v.split("-")[1]||"":v.split("-")[0]||"";

    const x=insertAtCursor(v,numberCursor,ch);activeMeasureInput.value=x.value;numberCursor=x.cursor;syncActiveMeasure();
  }
}

    const arr=touchArray(); if(!arr.length||!gesture)return;
    const v=memoInkView(fileId);
    if(arr.length>=2){
      if(gesture.type!=="pinch")beginGesture();
      const g=gesture,a=arr[0],b=arr[1];
      const dist=Math.hypot(b.x-a.x,b.y-a.y)||1;
      const oldScale=g.startScale;
      const newScale=Math.max(1,Math.min(4,oldScale*(dist/g.startDist)));
      const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
      const ratio=newScale/oldScale;
      v.scale=newScale;v._userAdjusted=true;
      // 2本指の中心移動も同時に反映して、拡大中の図面移動も可能にする。
      v.x=cx-(g.centerX-g.startX)*ratio;
      v.y=cy-(g.centerY-g.startY)*ratio;
    }else if(gesture.type==="pan"){
      const g=gesture,pt=arr[0];
      v.x=g.startX+(pt.x-g.startPX);
      v.y=g.startY+(pt.y-g.startPY);
      v._userAdjusted=true;
    }
    clampMemoInkView(stage,viewport,fileId);
  };

  canvas.addEventListener("pointerdown",e=>{
    if(!memoInkMode)return;
    if(e.pointerType==="mouse"&&e.button!==0)return;
    if(e.pointerType==="pen"){
      e.preventDefault();
      startStroke(e);
      return;
    }
    if(e.pointerType==="touch"){
      const r=viewport.getBoundingClientRect();
      touches.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
      canvas.setPointerCapture?.(e.pointerId);

      if(touches.size>=2){
        e.preventDefault();
        pageScrollGesture=null;
        if(drawing&&current)cancelStroke();
        beginGesture();
        return;
      }
      if(memoFingerDraw){
        e.preventDefault();
        pageScrollGesture=null;
        startStroke(e);
      }else{
        // Safariにスクロール判定を渡さず、指1本の縦移動を現調側でページスクロールに変換。
        e.preventDefault();
        gesture=null;
        pageScrollGesture={
          pointerId:e.pointerId,
          startClientY:e.clientY,
          startScrollY:window.scrollY,
          lastClientY:e.clientY
        };
      }
    }
  });

  canvas.addEventListener("pointermove",e=>{
    if(!memoInkMode)return;
    if(e.pointerType==="pen"&&drawing&&e.pointerId===drawPointerId&&current){
      e.preventDefault();
      const before=current.points.length;
      const pts=memoInkEventPoints(e,canvas);
      for(const pt of pts){
        const last=current.points[current.points.length-1];
        if(!last||Math.abs(pt.x-last.x)>.00015||Math.abs(pt.y-last.y)>.00015)current.points.push(pt);
      }
      if(current.points.length>before){
        current.lastMoveTime=performance.now();
        memoInkDrawLiveSegment(canvas,current,before);
      }
      return;
    }
    if(e.pointerType==="touch"){
      const r=viewport.getBoundingClientRect();
      if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
      if(touches.size>=2){
        e.preventDefault();
        if(drawing&&current)cancelStroke();
        updateGesture();
      }else if(memoFingerDraw&&drawing&&e.pointerId===drawPointerId&&current){
        e.preventDefault();
        const before=current.points.length;
        const pts=memoInkEventPoints(e,canvas);
        for(const pt of pts){
          const last=current.points[current.points.length-1];
          if(!last||Math.abs(pt.x-last.x)>.00015||Math.abs(pt.y-last.y)>.00015)current.points.push(pt);
        }
        if(current.points.length>before){
          current.lastMoveTime=performance.now();
          memoInkDrawLiveSegment(canvas,current,before);
        }
      }else if(!memoFingerDraw&&touches.size===1){
        e.preventDefault();
        gesture=null;
        if(pageScrollGesture&&pageScrollGesture.pointerId===e.pointerId){
          const dy=e.clientY-pageScrollGesture.startClientY;
          window.scrollTo(0,pageScrollGesture.startScrollY-dy);
          pageScrollGesture.lastClientY=e.clientY;
        }
      }
    }
  });

  canvas.addEventListener("pointerup",e=>{
    if(e.pointerType==="pen"){
      finishStroke(e);return;
    }
    if(e.pointerType==="touch"){
      if(drawing&&e.pointerId===drawPointerId&&touches.size<=1)finishStroke(e);
      touches.delete(e.pointerId);
      if(pageScrollGesture&&pageScrollGesture.pointerId===e.pointerId)pageScrollGesture=null;
      if(touches.size<2)gesture=null;
    }
  });
  canvas.addEventListener("pointercancel",e=>{
    if(e.pointerType==="touch"){
      touches.delete(e.pointerId);
      if(pageScrollGesture&&pageScrollGesture.pointerId===e.pointerId)pageScrollGesture=null;
    }
    if(drawing&&e.pointerId===drawPointerId)cancelStroke();
    if(!touches.size)gesture=null;
  });

  let inkResizeRaf=0;
  const ro=new ResizeObserver(()=>{
    cancelAnimationFrame(inkResizeRaf);
    inkResizeRaf=requestAnimationFrame(()=>{redraw();clampMemoInkView(stage,viewport,fileId)});
  });
  ro.observe(stage||canvas.parentElement||canvas);

  const toggle=card.querySelector(".memo-ink-toggle");
  if(toggle)toggle.onclick=()=>{
    memoInkMode=!memoInkMode;
    if(!memoInkMode){memoFingerDraw=false;cancelStroke();touches.clear();gesture=null;pageScrollGesture=null}
    refreshMemoInkCards();
  };
  const finger=card.querySelector(".memo-finger-toggle");
  if(finger)finger.onclick=()=>{memoFingerDraw=!memoFingerDraw;cancelStroke();touches.clear();gesture=null;pageScrollGesture=null;refreshMemoInkCards()};
  card.querySelectorAll(".memo-ink-tool").forEach(b=>b.onclick=()=>{memoInkTool=b.dataset.tool;refreshMemoInkCards()});
  card.querySelectorAll(".memo-ink-color").forEach(b=>b.onclick=()=>{memoInkColor=b.dataset.color;memoInkTool="pen";refreshMemoInkCards()});
  card.querySelectorAll(".memo-ink-width").forEach(b=>b.onclick=()=>{memoInkWidth=Number(b.dataset.width)||4;refreshMemoInkCards()});
  const undo=card.querySelector(".memo-ink-undo");
  if(undo)undo.onclick=()=>{const rec=memoInkRecord(fileId);if(rec.strokes.length){rec.redo.push(rec.strokes.pop());save();redraw();refreshMemoInkCards()}};
  const redo=card.querySelector(".memo-ink-redo");
  if(redo)redo.onclick=()=>{const rec=memoInkRecord(fileId);if(rec.redo.length){rec.strokes.push(rec.redo.pop());save();redraw();refreshMemoInkCards()}};
  const reset=card.querySelector(".memo-zoom-reset");
  if(reset)reset.onclick=()=>{memoInkViews.set(fileId,{scale:1,x:0,y:0});applyMemoInkView(stage,fileId)};

  applyMemoInkView(stage,fileId);
  updateCard();setTimeout(()=>{redraw();clampMemoInkView(stage,viewport,fileId)},50);
}


function ensureMemoPages(siteObj=state){
  if(!Array.isArray(siteObj.memoPages))siteObj.memoPages=[];
  if(!siteObj.memoPages.length){
    siteObj.memoPages=[{id:"memo-"+uid(),title:"メモ1",text:String(siteObj.memo||"")}];
  }
  siteObj.memoPages.forEach((p,i)=>{
    if(!p.id)p.id="memo-"+uid();
    if(typeof p.title!=="string"||!p.title.trim())p.title=`メモ${i+1}`;
    if(typeof p.text!=="string")p.text="";

async function memoDbAllForSite(siteId){
  const db=await openPhotoDB();

    const tx=db.transaction(MEMO_FILE_STORE,"readonly");
    const st=tx.objectStore(MEMO_FILE_STORE);
    const idx=st.index("siteId"),req=idx.getAll(siteId);
    req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)));
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function memoDbPut(rec){

    const tx=db.transaction(MEMO_FILE_STORE,"readwrite");
    tx.objectStore(MEMO_FILE_STORE).put(rec);
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function memoDbDelete(id){

    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function detectPdfPageRatio(blob){
  try{
    const buf=await blob.slice(0,512*1024).arrayBuffer();
    const bytes=new Uint8Array(buf);
    let s="";
    // PDF objects are mostly ASCII around MediaBox/CropBox. Read enough for first page metadata.
    const chunk=32768;
    for(let i=0;i<bytes.length;i+=chunk){
      s+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+chunk)));
    }
    const boxRe=/(?:\/MediaBox|\/CropBox)\s*\[\s*([+-]?\d*\.?\d+)\s+([+-]?\d*\.?\d+)\s+([+-]?\d*\.?\d+)\s+([+-]?\d*\.?\d+)\s*\]/g;
    let m;
    while((m=boxRe.exec(s))){
      const x1=Number(m[1]),y1=Number(m[2]),x2=Number(m[3]),y2=Number(m[4]);
      const w=Math.abs(x2-x1),h=Math.abs(y2-y1);
      if(w>10&&h>10)return {ratio:w/h,width:w,height:h,landscape:w>h};
    }
  }catch(e){console.warn("PDF page size detect failed",e)}
  return {ratio:1.414,width:842,height:595,landscape:true};
}
async function renderMemoPdfCanvasStack(container,blob){
  if(!container)return;
  container.innerHTML='<div class="memo-pdf-loading">PDFを読み込み中…</div>';
  if(!window.pdfjsLib){
    container.innerHTML='<div class="memo-pdf-fallback">PDF表示ライブラリを読み込めませんでした。「開く」から確認してください。</div>';
    return false;
  }
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const data=new Uint8Array(await blob.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data}).promise;
    container.innerHTML='';
    const cssWidth=Math.max(320,container.clientWidth||container.parentElement?.clientWidth||1000);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      const page=await pdf.getPage(pageNo);
      const base=page.getViewport({scale:1});
      const cssScale=cssWidth/base.width;
      const renderViewport=page.getViewport({scale:cssScale*dpr});
      const cssViewport=page.getViewport({scale:cssScale});
      const c=document.createElement('canvas');
      c.className='memo-pdf-page-canvas';
      c.width=Math.ceil(renderViewport.width);
      c.height=Math.ceil(renderViewport.height);
      c.style.width=Math.round(cssViewport.width)+'px';
      c.style.height=Math.round(cssViewport.height)+'px';
      c.dataset.page=String(pageNo);
      container.appendChild(c);
      const ctx=c.getContext('2d',{alpha:false});
      await page.render({canvasContext:ctx,viewport:renderViewport}).promise;
    }
    return true;
  }catch(e){
    console.error('PDF canvas render failed',e);
    container.innerHTML='<div class="memo-pdf-fallback">PDFの表示に失敗しました。「開く」から確認してください。</div>';
    return false;
  }
}

async function addMemoDrawingFiles(files,pageId){

  });

  const existing=(await memoDbAllForSite(state.id)).filter(x=>x.memoPageId===pageId);

  for(const file of arr){

      const isPdf=String(file.type||"").toLowerCase()==="application/pdf"||String(file.name||"").toLowerCase().endsWith(".pdf");
      let blob=file,mimeType=isPdf?"application/pdf":(file.type||"image/jpeg");
      if(!isPdf)blob=await compressPhotoFile(file,2000,.9);
      await memoDbPut({
        id:"memo-file-"+uid(),siteId:state.id,memoPageId:pageId,

  const files=(await memoDbAllForSite(state.id)).filter(x=>x.memoPageId===pageId);
  if(!confirm(`このメモページを削除しますか？${files.length?`\n添付している図面・画像 ${files.length}件も削除されます。`:""}`))return;
  for(const f of files){await memoDbDelete(f.id);delete ensureMemoInk(state)[f.id];try{localStorage.removeItem(memoEditorInkStorageKey(f.id))}catch{}memoEditorInkCache.delete(f.id)}

  ensureMemoPages(state);save();renderMemoPage();

function orderFmtNum(n){
  const x=Number(n)||0;
  return (Math.round((x+Number.EPSILON)*100)/100).toString();
}
function orderDisplayIdentity(item){
  const name=String(item.itemName||"").trim();
  const product=String(item.product||"").trim();
  if(name&&product)return {name,product};
  if(name)return {name,product:""};
  if(product)return {name:item.type||"商品",product};
  return null;
}

function ensureOrderOverrides(siteObj=state){
  if(!siteObj.orderOverrides||typeof siteObj.orderOverrides!=="object"||Array.isArray(siteObj.orderOverrides))siteObj.orderOverrides={};
  return siteObj.orderOverrides;
}
function orderOverrideFor(siteObj,key){
  const all=ensureOrderOverrides(siteObj);
  return all[key]||null;
}
function orderHasOverride(siteObj,key){
  const ov=orderOverrideFor(siteObj,key);
  if(!ov)return false;
  if(ov.qty!==undefined&&String(ov.qty).trim()!=="")return true;
  if(ov.cutCounts&&Object.values(ov.cutCounts).some(v=>String(v).trim()!==""))return true;
  if(ov.cutLengths&&Object.values(ov.cutLengths).some(v=>String(v).trim()!==""))return true;
  return false;
}
function orderCutSig(c){
  return [orderFmtNum(c.length),c.lengthUnit||"m",c.countUnit||"本"].join("|");
}
function resetOrderOverride(key){
  const all=ensureOrderOverrides(state);

  save();renderOrderPage();
}
function editableOrderOverride(key){
  const all=ensureOrderOverrides(state);
  if(!all[key])all[key]={};

}
function collectOrderData(siteObj=state){
  const groups={wall:[],floor:[],sheet:[],other:[]};

  // クロス：品番別に集計し、使用箇所は区分別ではなく「部屋ごとの合計」で表示
  const wallMap=new Map();
  (siteObj.rooms||[]).forEach(r=>{
    const roomByProduct=new Map();
    (r.sections||[]).forEach(sec=>{
      const product=effectiveWallProduct(sec,siteObj);
      if(!product)return;
      const t=secTotals(sec,siteObj);
      if(!t.withR)return;
      roomByProduct.set(product,(roomByProduct.get(product)||0)+t.withR);
    });
    roomByProduct.forEach((roomQty,product)=>{
      if(!wallMap.has(product))wallMap.set(product,{name:product,product:"",qty:0,rooms:[],roomTotals:[]});
      const g=wallMap.get(product);
      g.qty+=roomQty;
      g.rooms.push(r.name);
      g.roomTotals.push({room:r.name,qty:roomQty});
    });
  });
  groups.wall=[...wallMap.values()].map(x=>{
    const orderKey=`wall|${String(x.name||"").toLowerCase()}`;
    const autoOrderValue=Math.round((Number(x.qty)||0)*100)/100;
    const ov=orderOverrideFor(siteObj,orderKey);
    const hasOverride=ov&&ov.qty!==undefined&&String(ov.qty).trim()!=="";
    const orderValue=hasOverride?(Number(ov.qty)||0):autoOrderValue;
    return {...x,mode:"wall",orderKey,autoOrderValue,orderValue,orderUnit:"m",
      autoQtyText:`${orderFmtNum(autoOrderValue)}m`,
      qtyText:`${orderFmtNum(orderValue)}m`,hasOverride:!!hasOverride};
  });

  ensureFinishRooms(siteObj);
  const finishMap={floor:new Map(),sheet:new Map(),other:new Map()};

  (siteObj.finishRooms||[]).forEach(r=>(r.finishMaterials||[]).forEach(item=>{
    const id=orderDisplayIdentity(item);
    if(!id)return;
    const page=item.page||finishPageFromKind(item.kind||item.type);
    if(!finishMap[page])return;
    const kind=item.kind||item.type;
    let mode="qty", keyExtra="", qtyNum=0, unit="", detail="", cuts=[];

    if(kind==="CF"||kind==="リアテック"||kind==="ダイノック"){
      mode="cuts";
      cuts=(item.orderCuts||[]).filter(x=>(Number(x.length)||0)>0&&(Number(x.count)||0)>0);
      keyExtra="cuts";
      detail=cuts.length?cuts.map(x=>`${orderFmtNum(x.length)}${x.lengthUnit||"m"}×${orderFmtNum(x.count)}${x.countUnit||"本"}`).join(" / "):"発注寸法未入力";
    }else if(kind==="フロアタイル"){
      if(item.saleMode==="loose"){
        mode="qty";qtyNum=Number(item.pieces)||0;unit="枚";keyExtra="loose";
      }else{
        mode="tilecase";
        const area=Number(item.area)||0,per=Number(item.caseSqm)||0;
        qtyNum=area;unit="㎡";keyExtra=`case:${per}`;
        detail=per?`1ケース ${orderFmtNum(per)}㎡`:"1ケース㎡数 未入力";
      }
    }else if(kind==="ソフト巾木"){
      mode="basecase";
      qtyNum=Number(item.qty)||0;unit="m";
      const per=Number(item.caseMeters)||0;keyExtra=`base:${per}`;
      detail=per?`1ケース ${orderFmtNum(per)}m`:"1ケースm数 未入力";
    }else{
      const enteredCuts=(item.orderCuts||[]).filter(x=>(Number(x.length)||0)>0||(Number(x.count)||0)>0);
      if(enteredCuts.length){
        mode="cuts";cuts=enteredCuts;keyExtra="cuts";
        detail=enteredCuts.map(x=>{
          const len=Number(x.length)||0,count=Number(x.count)||0;
          const cu=x.countUnit||"本";return len>0&&count>0?`${orderFmtNum(len)}${x.lengthUnit||"m"}×${orderFmtNum(count)}${cu}`:count>0?`${orderFmtNum(count)}${cu}`:`${orderFmtNum(len)}${x.lengthUnit||"m"}`;
        }).join(" / ");
      }else{
        mode="qty";qtyNum=Number(item.qty)||0;unit=String(item.unit||"").trim()||"";
        keyExtra=`qty:${unit}`;
      }
    }

    const key=[id.name,id.product,item.type||"",keyExtra].join("|").toLowerCase();
    if(!finishMap[page].has(key)){
      finishMap[page].set(key,{...id,type:item.type||"",mode,keyExtra,orderKey:`${page}|${key}`,qtyNum:0,unit,detail:"",cuts:[],rooms:[]});
    }
    const g=finishMap[page].get(key);
    g.rooms.push(r.name);

    if(mode==="cuts"){
      cuts.forEach(c=>{
        const len=Number(c.length)||0,count=Number(c.count)||0;
        if(count<=0)return;
        const lengthUnit=c.lengthUnit||"m",countUnit=c.countUnit||"本";
        let row=g.cuts.find(x=>Math.abs((Number(x.length)||0)-len)<1e-9&&(x.lengthUnit||"m")===lengthUnit&&(x.countUnit||"本")===countUnit);
        if(!row){row={length:len,lengthUnit,count:0,countUnit};g.cuts.push(row)}
        row.count+=count;
      });
    }else{
      g.qtyNum+=qtyNum;
    }

    if(mode==="tilecase"){
      const per=Number(item.caseSqm)||0;
      g.casePer=per;
    }else if(mode==="basecase"){
      const per=Number(item.caseMeters)||0;
      g.casePer=per;
    }
  }));

  ["floor","sheet","other"].forEach(page=>{
    groups[page]=[...finishMap[page].values()].map(g=>{
      let qtyText="",detail=g.detail||"",autoQtyText="",orderValue=null,autoOrderValue=null,orderUnit="",hasOverride=false;
      const ov=orderOverrideFor(siteObj,g.orderKey);

      if(g.mode==="cuts"){
        detail="";
        g.cuts.sort((a,b)=>(Number(a.length)||0)-(Number(b.length)||0));
        g.cuts=g.cuts.map(x=>{
          const sig=orderCutSig(x),autoCount=Number(x.count)||0,autoLength=Number(x.length)||0;
          const rawCount=ov?.cutCounts?.[sig],rawLength=ov?.cutLengths?.[sig];
          const countChanged=rawCount!==undefined&&String(rawCount).trim()!=="";
          const lengthChanged=rawLength!==undefined&&String(rawLength).trim()!=="";
          const orderCount=countChanged?(Number(rawCount)||0):autoCount;
          const orderLength=lengthChanged?(Number(rawLength)||0):autoLength;
          if(countChanged||lengthChanged)hasOverride=true;
          return {...x,sig,autoCount,autoLength,orderCount,orderLength,countChanged,lengthChanged,changed:countChanged||lengthChanged};
        });
        autoQtyText=g.cuts.length?g.cuts.map(x=>{
          const len=Number(x.autoLength)||0,cu=x.countUnit||"本";
          return len>0?`${orderFmtNum(len)}${x.lengthUnit||"m"}×${orderFmtNum(x.autoCount)}${cu}`:`${orderFmtNum(x.autoCount)}${cu}`;
        }).join(" / "):"発注数量未入力";
        qtyText=g.cuts.length?g.cuts.map(x=>{
          const len=Number(x.orderLength)||0,cu=x.countUnit||"本";
          return len>0?`${orderFmtNum(len)}${x.lengthUnit||"m"}×${orderFmtNum(x.orderCount)}${cu}`:`${orderFmtNum(x.orderCount)}${cu}`;
        }).join(" / "):"発注数量未入力";
      }else if(g.mode==="tilecase"){
        autoOrderValue=g.casePer>0&&g.qtyNum>0?Math.ceil(g.qtyNum/g.casePer):0;orderUnit="ケース";
        const raw=ov?.qty;hasOverride=raw!==undefined&&String(raw).trim()!=="";
        orderValue=hasOverride?(Number(raw)||0):autoOrderValue;
        autoQtyText=autoOrderValue>0?`${orderFmtNum(autoOrderValue)}ケース`:"発注数量未入力";
        qtyText=orderValue>0?`${orderFmtNum(orderValue)}ケース`:"発注数量未入力";
        detail=`施工 ${orderFmtNum(g.qtyNum)}㎡${g.casePer?` / 1ケース ${orderFmtNum(g.casePer)}㎡`:""}`;
      }else if(g.mode==="basecase"){
        autoOrderValue=g.casePer>0&&g.qtyNum>0?Math.ceil(g.qtyNum/g.casePer):0;orderUnit="ケース";
        const raw=ov?.qty;hasOverride=raw!==undefined&&String(raw).trim()!=="";
        orderValue=hasOverride?(Number(raw)||0):autoOrderValue;
        autoQtyText=autoOrderValue>0?`${orderFmtNum(autoOrderValue)}ケース`:"発注数量未入力";
        qtyText=orderValue>0?`${orderFmtNum(orderValue)}ケース`:"発注数量未入力";
        detail=`採寸 ${orderFmtNum(g.qtyNum)}m${g.casePer?` / 1ケース ${orderFmtNum(g.casePer)}m`:""}`;
      }else{
        autoOrderValue=Number(g.qtyNum)||0;orderUnit=g.unit||"";
        const raw=ov?.qty;hasOverride=raw!==undefined&&String(raw).trim()!=="";
        orderValue=hasOverride?(Number(raw)||0):autoOrderValue;
        autoQtyText=autoOrderValue>0?`${orderFmtNum(autoOrderValue)}${orderUnit}`:"数量未入力";
        qtyText=orderValue>0?`${orderFmtNum(orderValue)}${orderUnit}`:"数量未入力";
      }
      return {...g,qtyText,autoQtyText,detail,orderValue,autoOrderValue,orderUnit,hasOverride};
    });
  });

  return groups;
}
function renderOrderPage(){

  const wrap=document.createElement("div");wrap.className="order-page";
  const data=collectOrderData(state);
  const defs=[["wall","クロス"]];

  defs.forEach(([key,label])=>{
    const items=data[key]||[];
    if(!items.length)return;
    any=true;

    g.innerHTML=`<div class="order-group-title">${label}</div>`;

    items.forEach(item=>{

      let compareHtml="";
      if(item.mode==="cuts"){
        const leftRows=(item.cuts||[]).map(c=>{
          const len=orderFmtNum(c.autoLength),cnt=orderFmtNum(c.autoCount);
          return `<div class="order-cut-original-row"><span>${esc(len)}</span><span>${esc(c.lengthUnit||"m")}</span><span>×</span><span>${esc(cnt)}</span><span>${esc(c.countUnit||"本")}</span></div>`;
        }).join("");

        const rightRows=(item.cuts||[]).map(c=>
          `<div class="order-cut-edit-row" data-cut-sig="${esc(c.sig)}">
            <button type="button" class="order-cut-length${c.lengthChanged?" changed":""}">${esc(orderFmtNum(c.orderLength))}</button>
            <span class="order-cut-unit-label">${esc(c.lengthUnit||"m")}</span>
            <span class="order-cut-unit-label">×</span>
            <button type="button" class="order-cut-count${c.countChanged?" changed":""}">${esc(orderFmtNum(c.orderCount))}</button>
            <span class="order-cut-unit">${esc(c.countUnit||"本")}</span>

        compareHtml=`<div class="order-compare">
          <div class="order-compare-col">
            <div class="order-compare-label">入力値</div>
            <div class="order-cut-original-list">${leftRows}</div>
          </div>
          <div class="order-compare-col">
            <div class="order-compare-label" style="text-align:right">発注</div>
            <div class="order-cut-edit-list">${rightRows}</div>
          </div>
          ${changed?`<div class="order-reset-wrap"><button type="button" class="order-reset">元に戻す</button></div>`:""}
        </div>`;
      }else{
        compareHtml=`<div class="order-compare">
          <div class="order-compare-col">
            <div class="order-compare-label">入力値</div>
            <div class="order-original-value">${esc(item.autoQtyText||item.qtyText||"")}</div>
          </div>
          <div class="order-compare-col">
            <div class="order-compare-label" style="text-align:right">発注</div>
            <div class="order-edit-value"><button type="button" class="order-item-qty-button${changed?" changed":""}">${esc(item.qtyText||"")}</button></div>
          </div>
          ${changed?`<div class="order-reset-wrap"><button type="button" class="order-reset">元に戻す</button></div>`:""}
        </div>`;
      }

      d.innerHTML=`<div class="order-item-head">
          <div><div class="order-item-name">${esc(item.name)}</div>${item.product?`<div class="order-item-product">${esc(item.product)}</div>`:""}</div>
        </div>
        ${compareHtml}
        ${wallRoomHtml}
        ${item.detail?`<div class="order-item-detail">${esc(item.detail)}</div>`:""}
        ${item.mode!=="wall"&&roomText?`<div class="order-room-label">${esc(roomText)}</div>`:""}`;

      const reset=d.querySelector(".order-reset");
      if(reset)reset.onclick=()=>resetOrderOverride(item.orderKey);

      if(item.mode==="cuts"){
        d.querySelectorAll(".order-cut-edit-row").forEach((row,idx)=>{
          const cut=item.cuts[idx],lenBtn=row.querySelector(".order-cut-length"),countBtn=row.querySelector(".order-cut-count");

          bindTapOnly(lenBtn,e=>{
            const ov=editableOrderOverride(item.orderKey);
            if(!ov.cutLengths||typeof ov.cutLengths!=="object")ov.cutLengths={};
            if(ov.cutLengths[cut.sig]===undefined)ov.cutLengths[cut.sig]=String(orderFmtNum(cut.orderLength));
            showGenericNumberKeypad(lenBtn,ov.cutLengths,cut.sig,"発注寸法",()=>{
              const v=String(ov.cutLengths[cut.sig]||"");
              lenBtn.textContent=v||orderFmtNum(cut.autoLength);
              lenBtn.classList.toggle("changed",v.trim()!=="");
            },e,()=>{hideMeasureKeypad();renderOrderPage()});
          });

          bindTapOnly(countBtn,e=>{
            const ov=editableOrderOverride(item.orderKey);
            if(!ov.cutCounts||typeof ov.cutCounts!=="object")ov.cutCounts={};
            if(ov.cutCounts[cut.sig]===undefined)ov.cutCounts[cut.sig]=String(orderFmtNum(cut.orderCount));
            showGenericNumberKeypad(countBtn,ov.cutCounts,cut.sig,"発注数量",()=>{
              const v=String(ov.cutCounts[cut.sig]||"");
              countBtn.textContent=v||orderFmtNum(cut.autoCount);
              countBtn.classList.toggle("changed",v.trim()!=="");
            },e,()=>{hideMeasureKeypad();renderOrderPage()});
          });
        });
      }else{
        const btn=d.querySelector(".order-item-qty-button");
        bindTapOnly(btn,e=>{
          const ov=editableOrderOverride(item.orderKey);
          if(ov.qty===undefined)ov.qty=String(orderFmtNum(item.orderValue));
          showGenericNumberKeypad(btn,ov,"qty","発注数量",()=>{
            const v=String(ov.qty||"");
            btn.textContent=(v.trim()!==""?`${orderFmtNum(Number(v)||0)}${item.orderUnit||""}`:item.autoQtyText);
            btn.classList.toggle("changed",v.trim()!=="");
          },e,()=>{hideMeasureKeypad();renderOrderPage()});
        });
      }

      g.appendChild(d);
    });
    wrap.appendChild(g);
  });

  if(!any){
    wrap.innerHTML='<div class="order-empty">品番または商品名が入力された発注対象はまだありません</div>';
  }
  area.appendChild(wrap);
}

const PHOTO_DB_NAME="gencho-wall-photo-db-v1",PHOTO_STORE="photos",MEMO_FILE_STORE="memoFiles";
const PHOTO_STAGES=["before","during","after"];
const PHOTO_STAGE_LABELS={before:"施工前",during:"施工中",after:"施工後"};
let activePhotoStage="before";
let photoTargetRoom="共通",photoTargetStage="before";
function photoStageOf(rec){return PHOTO_STAGES.includes(rec?.stage)?rec.stage:"before"}
function photoStageLabel(stage){return PHOTO_STAGE_LABELS[stage]||PHOTO_STAGE_LABELS.before}
function openPhotoDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PHOTO_DB_NAME,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(PHOTO_STORE)){
        const st=db.createObjectStore(PHOTO_STORE,{keyPath:"id"});
        st.createIndex("siteId","siteId",{unique:false});
      }
      if(!db.objectStoreNames.contains(MEMO_FILE_STORE)){
        const ms=db.createObjectStore(MEMO_FILE_STORE,{keyPath:"id"});
        ms.createIndex("siteId","siteId",{unique:false});
        ms.createIndex("memoPageId","memoPageId",{unique:false});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function photoDbAllForSite(siteId){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readonly"),st=tx.objectStore(PHOTO_STORE),idx=st.index("siteId"),req=idx.getAll(siteId);
    req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0)));
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function photoDbPut(rec){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readwrite");tx.objectStore(PHOTO_STORE).put(rec);
    tx.oncomplete=()=>{db.close();resolve(rec)};tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function photoDbDelete(id){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readwrite");tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
function ensurePhotoRoomPrefs(siteObj=state){
  if(!Array.isArray(siteObj.photoHiddenRooms))siteObj.photoHiddenRooms=[];
  if(!Array.isArray(siteObj.photoRoomOrder))siteObj.photoRoomOrder=[];
  if(!siteObj.photoRoomAliases||typeof siteObj.photoRoomAliases!=="object"||Array.isArray(siteObj.photoRoomAliases))siteObj.photoRoomAliases={};
}
function photoRoomDisplayName(roomName,siteObj=state){
  ensurePhotoRoomPrefs(siteObj);
  const fallback=roomName==="共通"?"その他":roomName;
  return String(siteObj.photoRoomAliases?.[roomName]||fallback);
}
function editPhotoRoomName(roomName,currentRooms=[]){
  ensurePhotoRoomPrefs(state);
  const current=photoRoomDisplayName(roomName,state);
  const value=prompt("写真・動画ページの部屋名を編集",current);
  if(value===null)return false;
  const next=String(value).trim();
  if(!next){alert("部屋名を入力してください");return false}
  const duplicate=(currentRooms||[]).some(n=>n!==roomName&&photoRoomDisplayName(n,state)===next);
  if(duplicate){alert("同じ部屋名がすでにあります");return false}
  if(next===roomName)delete state.photoRoomAliases[roomName];
  else state.photoRoomAliases[roomName]=next;
  save();return true;
}
function photoRoomNamesFromSite(siteObj=state,photos=[]){
  ensurePhotoRoomPrefs(siteObj);
  const raw=[],seen=new Set(),add=n=>{n=String(n||"").trim();if(!n||seen.has(n))return;seen.add(n);raw.push(n)};
  // 初期順：他ページで使っている部屋を上から順に、その最後に「その他」
  (siteObj.rooms||[]).forEach(r=>add(r.name));
  (siteObj.finishRooms||[]).forEach(r=>add(r.name));
  photos.forEach(p=>add(p.roomName));
  add("共通");

  const hidden=new Set(siteObj.photoHiddenRooms||[]);
  const visible=raw.filter(n=>!hidden.has(n));

  // 保存済みの並び順があれば「その他」も含めてその順番を優先
  const saved=(siteObj.photoRoomOrder||[]).filter(n=>visible.includes(n));
  visible.forEach(n=>{if(!saved.includes(n))saved.push(n)});

  // 初回のみ、raw が「各部屋 → その他」なのでその順になる
  siteObj.photoRoomOrder=[...saved];
  return saved;
}
function hidePhotoRoom(roomName){
  ensurePhotoRoomPrefs(state);
  if(!state.photoHiddenRooms.includes(roomName))state.photoHiddenRooms.push(roomName);
  state.photoRoomOrder=state.photoRoomOrder.filter(n=>n!==roomName);
  save();
}
function reorderPhotoRoom(fromName,toName,currentRooms=null){
  ensurePhotoRoomPrefs(state);
  const arr=[...(currentRooms||state.photoRoomOrder||[])];
  const from=arr.indexOf(fromName),to=arr.indexOf(toName);
  if(from<0||to<0||from===to)return;
  const [moved]=arr.splice(from,1);arr.splice(to,0,moved);
  state.photoRoomOrder=[...arr];
  save();
}
function compressPhotoFile(file,maxSide=1600,quality=.82){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
        c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error("PHOTO_ENCODE"))},"image/jpeg",quality);
      }catch(e){URL.revokeObjectURL(url);reject(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("PHOTO_LOAD"))};
    img.src=url;
  });
}
function mediaTypeOf(rec){
  if(rec?.mediaType)return rec.mediaType;
  const t=String(rec?.mimeType||rec?.blob?.type||"").toLowerCase();
  return t.startsWith("video/")?"video":"image";
}
function videoThumbnailBlob(blob){
  return new Promise((resolve)=>{
    const url=URL.createObjectURL(blob),v=document.createElement("video");
    v.preload="metadata";v.muted=true;v.playsInline=true;
    let done=false;
    const finish=x=>{if(done)return;done=true;URL.revokeObjectURL(url);resolve(x||null)};
    const grab=()=>{
      try{
        const w=v.videoWidth||640,h=v.videoHeight||360;
        if(!w||!h){finish(null);return}
        const max=900,scale=Math.min(1,max/Math.max(w,h));
        const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>finish(b),"image/jpeg",.78);
      }catch{finish(null)}
    };
    v.onloadedmetadata=()=>{
      try{
        const target=Math.min(.3,Math.max(0,(Number(v.duration)||0)/4));
        if(target>0){v.currentTime=target}else grab();
      }catch{grab()}
    };
    v.onseeked=grab;
    v.onerror=()=>finish(null);
    setTimeout(()=>finish(null),6000);
    v.src=url;v.load();
  });
}
async function addPhotoFiles(files,roomName,stage=activePhotoStage){
  const arr=[...files].filter(f=>{
    const t=String(f?.type||"").toLowerCase();
    return f&&(t.startsWith("image/")||t.startsWith("video/"));
  });
  if(!arr.length)return;
  const existing=(await photoDbAllForSite(state.id)).filter(p=>p.roomName===roomName&&photoStageOf(p)===stage);
  let order=existing.length?Math.max(...existing.map(x=>Number(x.order)||0))+1:1;
  for(const file of arr){
    try{
      const isVideo=String(file.type||"").toLowerCase().startsWith("video/");
      if(isVideo){
        const thumbBlob=await videoThumbnailBlob(file);
        await photoDbPut({id:uid(),siteId:state.id,roomName,stage,blob:file,thumbBlob,mediaType:"video",mimeType:file.type||"video/mp4",note:"",order:order++,createdAt:Date.now()});
      }else{
        const blob=await compressPhotoFile(file);
        await photoDbPut({id:uid(),siteId:state.id,roomName,stage,blob,mediaType:"image",mimeType:"image/jpeg",note:"",order:order++,createdAt:Date.now()});
      }
    }catch(e){console.error(e);alert("写真・動画の追加に失敗したものがあります")}
  }
  if(activeWorkPage==="photo")await renderPhotoPage();

function imageFromBlob(blob){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(blob),img=new Image();
    img.onload=()=>resolve({img,url});img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("PHOTO_LOAD"))};img.src=url;

}
async function buildPhotoExportCanvases(siteObj=state,roomFilter=null,stageFilter=null){
  const media=await photoDbAllForSite(siteObj.id);if(!media.length)return [];
  const stages=stageFilter?[stageFilter]:PHOTO_STAGES.filter(stage=>media.some(p=>photoStageOf(p)===stage));
  const out=[];
  const perPage=6,pageHeight=1700,rowH=430,gap=28,imgH=310;

  for(const stage of stages){
    const stageMedia=media.filter(p=>photoStageOf(p)===stage);
    if(!stageMedia.length)continue;
    const rooms=(roomFilter?[roomFilter]:photoRoomNamesFromSite(siteObj,media)).filter(n=>stageMedia.some(p=>p.roomName===n));

    for(const roomName of rooms){
      const list=stageMedia.filter(p=>p.roomName===roomName);
      const pageCount=Math.ceil(list.length/perPage);
      for(let pageIndex=0;pageIndex<pageCount;pageIndex++){
        const chunk=list.slice(pageIndex*perPage,(pageIndex+1)*perPage);
        const displayRoom=photoRoomDisplayName(roomName,siteObj);
        const baseSub=`${photoStageLabel(stage)}　${displayRoom}`;
        const subtitle=pageCount>1?`${baseSub}　${pageIndex+1}/${pageCount}`:baseSub;
        const base=exportCanvasBase("写真・動画",subtitle,pageHeight),{c,ctx,pad,width}=base;
        const y=base.y,colW=(width-pad*2-gap-50)/2;

        for(let i=0;i<chunk.length;i++){
          const col=i%2,row=Math.floor(i/2),x=pad+25+col*(colW+gap),top=y+row*rowH,rec=chunk[i];
          const isVideo=mediaTypeOf(rec)==="video";
          const previewBlob=isVideo?(rec.thumbBlob||null):rec.blob;
          ctx.fillStyle="#eeeae7";ctx.fillRect(x,top,colW,imgH);
          if(previewBlob){
            try{
              const {img,url}=await imageFromBlob(previewBlob);
              const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
              const scale=Math.min(colW/iw,imgH/ih),dw=iw*scale,dh=ih*scale;
              ctx.drawImage(img,x+(colW-dw)/2,top+(imgH-dh)/2,dw,dh);URL.revokeObjectURL(url);
            }catch{}
          }
          if(isVideo){
            ctx.fillStyle="rgba(0,0,0,.68)";roundedRect(ctx,x+12,top+12,105,34,17,"rgba(0,0,0,.68)");
            ctx.fillStyle="#fff";ctx.font='800 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
            ctx.fillText("🎥 動画",x+28,top+35);
          }
          if(rec.note){
            ctx.fillStyle="#5e5751";ctx.font='600 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
            const lines=wrapCanvasText(ctx,rec.note,colW-8).slice(0,3);
            lines.forEach((line,li)=>ctx.fillText(line,x+4,top+imgH+27+li*23));
          }
        }
        out.push(c);
      }
    }
  }
  return out;
}

function ensureGlueChecks(siteObj=state){
  if(!siteObj.glueChecks||typeof siteObj.glueChecks!=="object"||Array.isArray(siteObj.glueChecks))siteObj.glueChecks={};
  return siteObj.glueChecks;
}
function glueMeasureKey(roomObj,sec,m){
  return `${roomObj.id}|${sec.id}|${m.id}`;
}
function glueUsefulRooms(siteObj=state){
  return (siteObj.rooms||[]).filter(r=>(r.sections||[]).some(sec=>(sec.measures||[]).some(m=>String(m.value||"").trim())));
}
function glueDoneQty(checks,key,totalQty){
  const raw=checks[key];
  if(raw===true)return totalQty; // v2.4.26 のチェック済みデータを引き継ぐ
  const n=Number(raw);
  if(!Number.isFinite(n)||n<=0)return 0;
  return Math.max(0,Math.min(totalQty,Math.floor(n)));
}
function setGlueDoneQty(checks,key,qty,totalQty){
  const n=Math.max(0,Math.min(totalQty,Math.floor(Number(qty)||0)));
  if(n<=0)delete checks[key];
  else checks[key]=n;
}
function glueSummary(siteObj=state){
  const checks=ensureGlueChecks(siteObj);
  let totalM=0,doneM=0;
  const byProduct=new Map();
  glueUsefulRooms(siteObj).forEach(r=>(r.sections||[]).forEach(sec=>{
    const rv=effectiveWallRepeatV(sec,siteObj);
    const product=String(effectiveWallProduct(sec,siteObj)||"").trim()||"品番未入力";
    if(!byProduct.has(product))byProduct.set(product,{product,totalM:0,doneM:0,remainingM:0});
    const ps=byProduct.get(product);
    (sec.measures||[]).forEach(m=>{
      if(!String(m.value||"").trim())return;
      const c=calc(m.value,rv);if(!c)return;
      const key=glueMeasureKey(r,sec,m);
      const doneQty=glueDoneQty(checks,key,c.qty);
      const measureDoneM=(c.each*doneQty)/100;
      totalM+=c.withM;
      doneM+=measureDoneM;
      ps.totalM+=c.withM;
      ps.doneM+=measureDoneM;
    });
  }));
  const remainingM=Math.max(0,totalM-doneM);
  const products=[...byProduct.values()].map(x=>({...x,remainingM:Math.max(0,x.totalM-x.doneM)}));
  return {totalM,doneM,remainingM,products};
}
function refreshGlueSummary(wrap){
  const s=glueSummary(state);
  const total=wrap?.querySelector(".glue-total-m");
  const remain=wrap?.querySelector(".glue-remaining-m");
  if(total)total.textContent=fmt(s.totalM);
  if(remain)remain.textContent=fmt(s.remainingM);
}

}

function bindMeasureDrag(handle,row,sec,m){
  if(!handle||handle.dataset.dragBound==="1")return;
  handle.dataset.dragBound="1";
  handle.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();hideMeasureKeypad();hideProductKeypad();
    handle.setPointerCapture?.(e.pointerId);
    let targetId=null,targetRow=null;
    const move=ev=>{
      document.querySelectorAll(".measure-row.drop-target").forEach(x=>x.classList.remove("drop-target"));
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const tr=el?.closest?.(".measure-row");
      if(tr&&tr!==row&&tr.dataset.mid){
        targetId=tr.dataset.mid;targetRow=tr;tr.classList.add("drop-target");
      }
    };
    const up=()=>{
      targetRow?.classList.remove("drop-target");
      handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);handle.removeEventListener("pointercancel",up);
      if(targetId){
        const from=sec.measures.findIndex(x=>x.id===m.id),to=sec.measures.findIndex(x=>x.id===targetId);
        if(from>=0&&to>=0&&from!==to){
          const [item]=sec.measures.splice(from,1);
          sec.measures.splice(to,0,item);
          save();render();
        }
      }
    };
    handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",up);handle.addEventListener("pointercancel",up);
  });
}

// 共通タップ判定：指が動いた場合はスワイプとして扱い、入力・選択を開始しない
function bindTapOnly(el,handler,threshold=10){
  if(!el)return;
  let sx=0,sy=0,moved=false,suppressClick=false;
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse")return;
    sx=e.clientX;sy=e.clientY;moved=false;
  },{passive:true});
  el.addEventListener("pointermove",e=>{
    if(e.pointerType==="mouse")return;
    if(Math.abs(e.clientX-sx)>threshold||Math.abs(e.clientY-sy)>threshold)moved=true;
  },{passive:true});
  el.addEventListener("pointerup",e=>{
    if(e.pointerType==="mouse")return;
    suppressClick=true;
    setTimeout(()=>{suppressClick=false},350);
    if(moved)return;
    e.preventDefault();
    handler(e);
  });
  el.addEventListener("pointercancel",()=>{moved=true});
  el.addEventListener("click",e=>{
    if(suppressClick)return;
    e.preventDefault();
    handler(e);
  });
}

    if(e.pointerType==="mouse")return;
    sx=e.clientX;sy=e.clientY;moved=false;
  },{passive:true});
  inp.addEventListener("pointermove",e=>{
    if(e.pointerType==="mouse")return;
    if(Math.abs(e.clientX-sx)>MOVE_THRESHOLD||Math.abs(e.clientY-sy)>MOVE_THRESHOLD)moved=true;
  },{passive:true});
  inp.addEventListener("pointerup",e=>{
    if(e.pointerType==="mouse")return;
    suppressClick=true;
    setTimeout(()=>{suppressClick=false},350);
    if(moved)return;
    e.preventDefault();

function sectionGroups(siteObj=state){

  const order=[];

async function canvasToPdfJpegs(canvas){

    const h=Math.min(sliceH,canvas.height-sy),page=document.createElement("canvas");page.width=canvas.width;page.height=h;const x=page.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,page.width,page.height);x.drawImage(canvas,0,sy,canvas.width,h,0,0,canvas.width,h);out.push(await canvasToJpegInfo(page));
  }
  return out;
}
function makePdfFromJpegs(images){
  const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;
  const pushText=s=>{const b=enc.encode(s);chunks.push(b);length+=b.length};
  const pushBytes=b=>{chunks.push(b);length+=b.length};
  const objStart=n=>{offsets[n]=length;pushText(`${n} 0 obj\n`)};
  const objEnd=()=>pushText(`endobj\n`);
  const A4W=595.28,A4H=841.89;
  const pageObjs=images.map((_,i)=>3+i*3),objCount=2+images.length*3;
  pushText("%PDF-1.4\n%PDFGEN\n");
  objStart(1);pushText("<< /Type /Catalog /Pages 2 0 R >>\n");objEnd();
  objStart(2);pushText(`<< /Type /Pages /Count ${images.length} /Kids [${pageObjs.map(n=>`${n} 0 R`).join(" ")}] >>\n`);objEnd();

  images.forEach((im,i)=>{
    const pageObj=3+i*3,imageObj=pageObj+1,contentObj=pageObj+2;
    const original=!!im.originalPdfPage;
    const pageW=original?Number(im.pageW)||A4W:A4W;
    const pageH=original?Number(im.pageH)||A4H:A4H;
    const margin=original?0:18;

    let drawW,drawH,x,y;
    if(original){
      // 図面は元PDFのページサイズ・縦横・比率をそのまま維持。
      drawW=pageW;drawH=pageH;x=0;y=0;
    }else{
      // アプリ生成ページはA4縦に統一。
      const scale=Math.min((pageW-margin*2)/im.width,(pageH-margin*2)/im.height);
      drawW=im.width*scale;drawH=im.height*scale;
      x=(pageW-drawW)/2;y=(pageH-drawH)/2;
    }

    const content=`q\n${drawW.toFixed(3)} 0 0 ${drawH.toFixed(3)} ${x.toFixed(3)} ${y.toFixed(3)} cm\n/Im0 Do\nQ\n`,cb=enc.encode(content);
    objStart(pageObj);
    pushText(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(3)} ${pageH.toFixed(3)}] /Resources << /XObject << /Im0 ${imageObj} 0 R >> >> /Contents ${contentObj} 0 R >>\n`);
    objEnd();

    objStart(imageObj);
    pushText(`<< /Type /XObject /Subtype /Image /Width ${im.width} /Height ${im.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    pushBytes(im.bytes);pushText("\nendstream\n");objEnd();

    objStart(contentObj);
    pushText(`<< /Length ${cb.length} >>\nstream\n`);pushBytes(cb);pushText("endstream\n");objEnd();
  });

  const xref=length;
  pushText(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);
  for(let n=1;n<=objCount;n++)pushText(`${String(offsets[n]).padStart(10,"0")} 00000 n \n`);
  pushText(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob([concatUint8(chunks)],{type:"application/pdf"});
}
async function buildRoomsPdfFile(siteObj,rooms,fileName,includeSiteTotal=false){

  }

}

  return true;
}

function orderExportSegments(item){
  if(item.mode!=="cuts")return [{item,cuts:null,continued:false,last:true,height:orderExportItemHeight(item)}];

  const cuts=item.cuts||[];
  // 1カードが1ページを超えないよう、長い寸法一覧だけ分割。
  // 2列×最大16行 = 32寸法/カード。
  const maxCuts=32;
  if(cuts.length<=maxCuts)return [{item,cuts,continued:false,last:true,height:orderExportItemHeight(item)}];

  const out=[];
  for(let i=0;i<cuts.length;i+=maxCuts){
    const chunk=cuts.slice(i,i+maxCuts),last=i+maxCuts>=cuts.length;

      height:orderExportItemHeight(item,chunk.length,last)

    ctx.fillStyle="#2f2b28";
    ctx.font='800 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillText(label,left,y);y+=48;
  };
  const ensureSpace=(need,label=null)=>{
    if(y+need<=bottomLimit)return;
    newPage();
    if(label)drawCategory(label);
  };
  const drawItemSegment=(segment,key)=>{
    const item=segment.item,cuts=segment.cuts,continued=segment.continued,last=segment.last;
    const cardH=segment.height;
    roundRectFill(left,y,contentW,cardH,18,"#fbfaf8","#e9e3de");

    let cy=y+28;
    const innerL=left+24,innerR=right-24;

    // クロスは品番が主役。
    // それ以外は「種類名を小さく薄く / 品番を大きく濃く」。
    if(key==="wall"){
      ctx.fillStyle="#332f2c";
      ctx.font='800 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(`${item.name}${continued?"（続き）":""}`,innerL,cy);
      cy+=38;
    }else if(item.product){
      ctx.fillStyle="#8a817a";
      ctx.font='700 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(item.name,innerL,cy);
      cy+=27;
      ctx.fillStyle="#332f2c";
      ctx.font='800 25px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(`${item.product}${continued?"（続き）":""}`,innerL,cy);
      cy+=40;
    }else{
      ctx.fillStyle="#332f2c";
      ctx.font='800 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(`${item.name}${continued?"（続き）":""}`,innerL,cy);
      cy+=38;
    }

    ctx.strokeStyle="#ece6e1";
    ctx.beginPath();ctx.moveTo(innerL,cy);ctx.lineTo(innerR,cy);ctx.stroke();
    cy+=22;

    if(item.mode==="cuts"){
      const useCuts=cuts||item.cuts||[];
      const colGap=28,colW=(innerR-innerL-colGap)/2;
      const rows=Math.ceil(useCuts.length/2);
      ctx.fillStyle="#45403c";
      ctx.font='750 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';

      for(let i=0;i<useCuts.length;i++){
        const row=Math.floor(i/2),col=i%2;
        const x=innerL+col*(colW+colGap);
        const yy=cy+row*48;
        const cut=useCuts[i];
        const len=orderFmtNum(cut.orderLength),cnt=orderFmtNum(cut.orderCount);
        ctx.strokeStyle="#6c645e";ctx.lineWidth=2;
        ctx.strokeRect(x,yy-17,20,20);
        ctx.fillStyle="#45403c";
        ctx.fillText(`${len}${cut.lengthUnit||"m"} × ${cnt}${cut.countUnit||"本"}`,x+34,yy);
      }
      cy+=rows*48+6;
    }else{
      ctx.strokeStyle="#6c645e";ctx.lineWidth=2;
      ctx.strokeRect(innerL,cy-17,22,22);
      ctx.fillStyle="#3e3935";
      ctx.font='800 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(item.qtyText||"",innerL+38,cy+1);
      cy+=49;
    }

    // 部屋名・補足は分割カードの最後だけ表示
    if(last){
      if(item.mode==="wall"&&Array.isArray(item.roomTotals)&&item.roomTotals.length){
        const chips=item.roomTotals.map(x=>`${x.room} ${orderFmtNum(x.qty)}m`);
        let cx=innerL,rowY=cy;
        ctx.font='700 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
        chips.forEach(chip=>{
          const tw=ctx.measureText(chip).width+28;
          if(cx+tw>innerR){cx=innerL;rowY+=34}
          roundRectFill(cx,rowY-19,tw,28,9,"#f0ece8");
          ctx.fillStyle="#5d554f";ctx.fillText(chip,cx+14,rowY);
          cx+=tw+10;
        });
        cy=rowY+30;
      }else{
        const roomText=[...new Set(item.rooms||[])].join("・");
        if(roomText){
          ctx.fillStyle="#5d554f";
          ctx.font='800 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
          const rw=Math.min(innerR-innerL,ctx.measureText(roomText).width+30);
          roundRectFill(innerL,cy-19,rw,29,9,"#f0ece8");
          ctx.fillText(roomText,innerL+15,cy);cy+=36;
        }
      }
      if(item.detail){
        ctx.fillStyle="#8a817a";
        ctx.font='600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
        wrapCanvasText(ctx,item.detail,innerR-innerL).forEach(line=>{ctx.fillText(line,innerL,cy);cy+=23});
      }
    }
    y+=cardH+18;
  };

  newPage();

  defs.forEach(([key,label])=>{
    const items=data[key]||[];if(!items.length)return;
    ensureSpace(70);
    drawCategory(label);

    items.forEach(item=>{
      const segments=orderExportSegments(item);
      segments.forEach((segment,idx)=>{
        // カード単位でページ跨ぎを防止。
        ensureSpace(segment.height+18,label);
        drawItemSegment(segment,key);
      });
    });
    y+=8;
  });

  return pages;
}

function combineCanvasesVertically(canvases){
  const valid=canvases.filter(Boolean);if(!valid.length)return null;

  const height=valid.reduce((s,c)=>s+c.height,0)+gap*(valid.length-1);

  let y=0;valid.forEach(c=>{ctx.drawImage(c,0,y);y+=c.height+gap});return out;
}

async function drawingBlobHash(rec){
  try{
    const buf=await rec.blob.arrayBuffer();
    if(window.crypto?.subtle){
      const digest=await crypto.subtle.digest("SHA-256",buf);
      return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    // fallback: byte content checksum (still filename-independent)
    const a=new Uint8Array(buf);let h1=2166136261>>>0,h2=0;
    for(let i=0;i<a.length;i++){h1=Math.imul(h1^a[i],16777619)>>>0;h2=(h2+a[i]*(i+1))>>>0}
    return `${a.length}:${h1.toString(16)}:${h2.toString(16)}`;
  }catch(e){
    console.warn("drawing hash failed",e);
    return `fallback:${rec.id}`;
  }
}
function drawingInkScore(rec){
  try{
    const ink=memoEditorInkRec(rec.id);
    return (ink?.pageStrokes||[]).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
  }catch{return 0}
}
async function uniqueDrawingRecords(records){
  const byHash=new Map();
  for(const rec of (records||[])){
    // ファイル名が違っても、PDF/画像の実データが同じなら同一図面として扱う。
    const hash=await drawingBlobHash(rec);
    const prev=byHash.get(hash);
    if(!prev){
      byHash.set(hash,rec);
      continue;
    }
    // 同じ実データが重複している場合は、手書きが多く残っている方を採用。
    if(drawingInkScore(rec)>drawingInkScore(prev))byHash.set(hash,rec);
  }
  return [...byHash.values()];
}

async function buildDrawingExportCanvases(siteObj=state,selectedIds=null){
  if(!window.pdfjsLib)throw new Error("pdfjs not loaded");
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const all=await uniqueDrawingRecords(await memoDbAllForSite(siteObj.id));
  const ids=Array.isArray(selectedIds)?new Set(selectedIds):null;
  const files=all.filter(f=>!ids||ids.has(f.id));
  const out=[];

  for(const rec of files){
    const isPdf=rec.isPdf||String(rec.mimeType||"").toLowerCase()==="application/pdf";
    const ink=memoEditorInkRec(rec.id);

    if(isPdf){
      try{
        // サムネ・画面キャッシュは一切使わず、保存されている元PDFを直接再描画。
        const bytes=new Uint8Array(await rec.blob.arrayBuffer());
        const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
        for(let pageIndex=0;pageIndex<pdf.numPages;pageIndex++){
          const pg=await pdf.getPage(pageIndex+1);
          const base=pg.getViewport({scale:1});
          const targetLong=2000;
          const scale=Math.max(1,Math.min(2.5,targetLong/Math.max(base.width,base.height)));
          const view=pg.getViewport({scale});
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.ceil(view.width));c.height=Math.max(1,Math.ceil(view.height));
          // 元PDFのMediaBox相当（PDF.js scale:1 は point 単位）を保持。
          c._pdfOriginalPage=true;
          c._pdfPageW=base.width;
          c._pdfPageH=base.height;
          const ctx=c.getContext("2d",{alpha:false});
          ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
          await pg.render({canvasContext:ctx,viewport:view}).promise;

          // 全画面エディタと同じ 0..1 のページ正規化座標を、元PDFページ全面へそのまま重ねる。
          const strokes=ink.pageStrokes?.[pageIndex]||[];
          if(strokes.length)editorCompositeStrokes(ctx,strokes,0,0,c.width,c.height);
          out.push(c);
        }
      }catch(e){console.error("original PDF drawing export",rec.fileName,e)}
    }else{
      try{
        // 画像もサムネではなく元画像を直接使用。
        const url=URL.createObjectURL(rec.blob);
        const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=url});
        const maxSide=2000,sc=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
        const w=Math.max(1,Math.round((img.naturalWidth||img.width)*sc));
        const h=Math.max(1,Math.round((img.naturalHeight||img.height)*sc));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d",{alpha:false});
        ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        const strokes=ink.pageStrokes?.[0]||[];
        if(strokes.length)editorCompositeStrokes(ctx,strokes,0,0,w,h);
        out.push(c);
      }catch(e){console.error("original image drawing export",rec.fileName,e)}
    }
  }
  return out;
}
async function buildSelectedExportCanvases(parts,siteObj=state){
  const canvases=[];
  const safe=(label,fn)=>{try{const v=fn();if(Array.isArray(v))canvases.push(...v);else if(v)canvases.push(v)}catch(e){console.error(label+" export",e)}};
  if(parts.includes("wall")){
    safe("wall",()=>{
      const out=[];
      (siteObj.rooms||[]).filter(r=>r.sections?.some(sec=>sec.measures?.some(m=>String(m.value||"").trim()))).forEach(r=>{
        // 現場まとめPDFでも、部屋PDFと同じ「区分単位」のページを使う。
        // これにより長い1枚画像をA4位置で機械的に切って空白ページが出るのを防ぐ。
        out.push(...buildRoomExportCanvases(r,siteObj));
      });
      if((siteObj.rooms||[]).some(r=>r.sections?.some(sec=>sec.measures?.some(m=>String(m.value||"").trim()))))out.push(buildSiteTotalCanvas(siteObj));
      return out;
    });
  }
  if(parts.includes("floor"))safe("floor",()=>finishExportItems("floor",siteObj).length?buildFinishExportCanvas("floor",siteObj):null);
  if(parts.includes("sheet"))safe("sheet",()=>finishExportItems("sheet",siteObj).length?buildFinishExportCanvas("sheet",siteObj):null);
  if(parts.includes("other"))safe("other",()=>finishExportItems("other",siteObj).length?buildFinishExportCanvas("other",siteObj):null);
  if(parts.includes("photo")){
    try{canvases.push(...await buildPhotoExportCanvases(siteObj))}catch(e){console.error("photo export",e)}
  }
  if(parts.includes("memo")){
    try{canvases.push(...await buildMemoExportCanvases(siteObj,{excludeDrawings:true}))}catch(e){console.error("memo export",e)}
  }
  if(parts.includes("drawing")){
    try{
      const ids=selectedDrawingExportIds();
      if(ids.length)canvases.push(...await buildDrawingExportCanvases(siteObj,ids));
    }catch(e){console.error("drawing export",e)}
  }
  if(parts.includes("order")){
    safe("order",()=>{
      const od=collectOrderData(siteObj);
      return ["wall","floor","sheet","other"].some(k=>(od[k]||[]).length)?buildOrderExportCanvases(siteObj):[];
    });
  }
  return canvases.filter(Boolean);
}

function fmtDate(ts){

function siteRepeatTotal(s){
  let total=0;

 box.addEventListener("selectstart",e=>e.preventDefault());

   let timer=0,dragging=false,pid=null,sx=0,sy=0,suppressClick=false;
   btn.onclick=()=>{if(!suppressClick)setWorkPage(btn.dataset.workPage)};
   const clear=()=>{if(timer){clearTimeout(timer);timer=0}};
   btn.addEventListener("pointerdown",e=>{
     if(e.pointerType==="mouse"&&e.button!==0)return;
     pid=e.pointerId;sx=e.clientX;sy=e.clientY;dragging=false;suppressClick=false;clear();
     timer=setTimeout(()=>{
       dragging=true;suppressClick=true;

     },450);
   });
   btn.addEventListener("pointermove",e=>{
     if(e.pointerId!==pid)return;
     if(!dragging){if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clear();return}
     e.preventDefault();
     const t=document.elementFromPoint(e.clientX,e.clientY)?.closest?.("[data-work-page]");

     box.insertBefore(btn,e.clientX<r.left+r.width/2?t:t.nextSibling);
   },{passive:false});
   const finish=e=>{

     clear();

 });

  const p0=pts[0];

  // 直線ツールは「始点→終点」の2点をそのまま結ぶ。
  // 以前は2点でもquadraticCurveToを使っていたため、
  // 終点ではなく中間点で線が止まっていた。
  if(s.shape==="line" && pts.length>=2){

    const last=pts[pts.length-1];
    ctx.lineTo(last.x*w,last.y*h);

      x:Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width))),
      y:Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height)))
    };
  };

  const cssPointFromNorm=p=>{
    const r=pageRect();
    return {x:p.x*r.width,y:p.y*r.height};
  };

  const setupCanvas=()=>{
    const r=pageRect();
    const dpr=Math.min(1.5,window.devicePixelRatio||1);
    const w=Math.max(1,Math.round(r.width*dpr));
    const h=Math.max(1,Math.round(r.height*dpr));
    if(canvas.width!==w||canvas.height!==h){
      canvas.width=w;canvas.height=h;
    }
    const ctx=canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,r,dpr};
  };

  const drawStrokeFast=(ctx,stroke,r)=>{
    const pts=stroke?.points||[];
    if(!pts.length)return;
    ctx.save();
    ctx.lineCap="round";ctx.lineJoin="round";
    if(stroke.tool==="eraser"){
      ctx.globalCompositeOperation="destination-out";
      ctx.strokeStyle="rgba(0,0,0,1)";
      ctx.lineWidth=(stroke.width||18)*Math.max(.7,r.width/900);
    }else{
      ctx.globalCompositeOperation="source-over";
      ctx.strokeStyle=stroke.color||"#d32f2f";
      ctx.lineWidth=(stroke.width||4)*Math.max(.7,r.width/900);
    }
    ctx.beginPath();
    const p0=cssPointFromNorm(pts[0]);
    ctx.moveTo(p0.x,p0.y);
    if(stroke.shape==="line"&&pts.length>=2){
      const p=cssPointFromNorm(pts[pts.length-1]);
      ctx.lineTo(p.x,p.y);
    }else{
      for(let i=1;i<pts.length;i++){
        const p=cssPointFromNorm(pts[i]);
        ctx.lineTo(p.x,p.y);
      }
    }
    if(pts.length===1){
      ctx.arc(p0.x,p0.y,ctx.lineWidth/2,0,Math.PI*2);
    }

    ctx.restore();
  };

  const redrawAll=()=>{
    const {ctx,r}=setupCanvas();
    ctx.clearRect(0,0,r.width,r.height);
    const strokes=editorStrokes(fileId,pageIndex);
    for(const s of strokes)drawStrokeFast(ctx,s,r);
  };

  const flushLiveSegments=()=>{
    liveRaf=0;
    if(!liveSegments.length)return;
    const {ctx,r}=setupCanvas();
    while(liveSegments.length){
      const {a,b,stroke}=liveSegments.shift();
      const pa=cssPointFromNorm(a),pb=cssPointFromNorm(b);
      ctx.save();
      ctx.lineCap="round";ctx.lineJoin="round";
      if(stroke.tool==="eraser"){
        ctx.globalCompositeOperation="destination-out";
        ctx.strokeStyle="rgba(0,0,0,1)";
        ctx.lineWidth=(stroke.width||18)*Math.max(.7,r.width/900);
      }else{
        ctx.globalCompositeOperation="source-over";
        ctx.strokeStyle=stroke.color||"#d32f2f";
        ctx.lineWidth=(stroke.width||4)*Math.max(.7,r.width/900);
      }
      ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();ctx.restore();
    }
  };
  const drawIncrement=(a,b,stroke)=>{
    liveSegments.push({a:{...a},b:{...b},stroke:{tool:stroke.tool,color:stroke.color,width:stroke.width}});
    if(!liveRaf)liveRaf=requestAnimationFrame(flushLiveSegments);
  };

  const drawLinePreview=()=>{
    redrawAll();
    if(!current||!lineStart||!lineEnd)return;
    const {ctx,r}=setupCanvas();
    drawStrokeFast(ctx,{tool:"pen",color:current.color,width:current.width,points:[lineStart,lineEnd]},r);
  };

  const begin=e=>{
    drawing=true;
    pointerId=e.pointerId;
    try{canvas.setPointerCapture(pointerId)}catch{}
    try{window.getSelection()?.removeAllRanges()}catch{}
    const p=normPointFromEvent(e);
    current={
      tool:memoEditorTool,
      color:memoEditorColor,
      width:memoEditorTool==="eraser"?Math.max(18,memoEditorWidth*4):memoEditorWidth,
      points:[p]
    };
    lastRawPoint=p;
    if(memoEditorTool==="line"){
      lineStart={...p}; lineEnd={...p};
    }else{
      lineStart=null; lineEnd=null;
    }
    editorRedo(fileId,pageIndex).length=0;
  };

  const handleMoveEvent=e=>{
    if(!drawing||e.pointerId!==pointerId||!current)return;
    e.preventDefault();e.stopPropagation();

    const coalesced=(typeof e.getCoalescedEvents==="function")?e.getCoalescedEvents():[];
    const events=coalesced.length?coalesced:[e];

    if(current.tool==="line"){
      const ev=events[events.length-1]||e;
      lineEnd=normPointFromEvent(ev);
      drawLinePreview();
      return;
    }

    const r=pageRect();
    for(const ev of events){
      const p=normPointFromEvent(ev);
      const last=current.points[current.points.length-1];
      const px=Math.hypot((p.x-last.x)*r.width,(p.y-last.y)*r.height);
      // Pencil追従優先：0.25px以上の動きだけ追加
      if(px>=0.4){
        current.points.push(p);
        drawIncrement(last,p,current);
      }
      lastRawPoint=p;
    }
  };

  const finish=e=>{
    if(!drawing||e.pointerId!==pointerId||!current)return;
    e.preventDefault();e.stopPropagation();
    drawing=false;
    try{canvas.releasePointerCapture(pointerId)}catch{}

    if(current.tool==="line"){
      const a=lineStart||current.points[0];
      const b=lineEnd||a;
      current.tool="pen";
      current.shape="line";
      current.points=[{...a},{...b}];
    }else{
      // pointerup座標は使わず、最後にpointermove/rawupdateで取得した点を採用
      if(lastRawPoint){
        const last=current.points[current.points.length-1];
        if(!last||Math.abs(last.x-lastRawPoint.x)>.00001||Math.abs(last.y-lastRawPoint.y)>.00001){
          current.points.push({...lastRawPoint});
        }
      }
      if(current.points.length===1)current.points.push({...current.points[0]});
    }

    if(liveRaf){cancelAnimationFrame(liveRaf);liveRaf=0;flushLiveSegments()}
    editorStrokes(fileId,pageIndex).push(current);
    persistMemoEditorInk(fileId);

    current=null;pointerId=null;lastRawPoint=null;lineStart=null;lineEnd=null;
    redrawAll();
    updateMemoEditorControls();
  };

  canvas.addEventListener("pointerdown",e=>{
    if(e.pointerType==="pen"){
      e.preventDefault();begin(e);
    }else if(e.pointerType==="touch"&&memoEditorFingerDraw){
      e.preventDefault();begin(e);
    }
  },{passive:false});

  canvas.addEventListener("pointermove",e=>{
    if(e.pointerType==="pen"||(e.pointerType==="touch"&&memoEditorFingerDraw)){
      handleMoveEvent(e);
    }
  },{passive:false});

  if("onpointerrawupdate" in window){
    canvas.addEventListener("pointerrawupdate",e=>{
      if(e.pointerType==="pen"&&drawing&&e.pointerId===pointerId){
        handleMoveEvent(e);
      }
    },{passive:false});
  }

  canvas.addEventListener("pointerup",finish,{passive:false});
  canvas.addEventListener("pointercancel",e=>{
    if(drawing&&e.pointerId===pointerId){
      drawing=false;
      current=null;pointerId=null;lastRawPoint=null;lineStart=null;lineEnd=null;
      redrawAll();
    }
  });

  canvas.addEventListener("selectstart",e=>e.preventDefault());
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("dragstart",e=>e.preventDefault());

  let raf=0;
  new ResizeObserver(()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(redrawAll);
  }).observe(canvas.parentElement);

  setTimeout(redrawAll,60);
}

function bindMemoEditorViewportGestures(){
  const vp=$("#memoEditorViewport");if(!vp||vp.dataset.bound==="1")return;
  vp.dataset.bound="1";
  const touches=new Map();
  let oneFinger=null,pinch=null;
  vp.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch"||memoEditorFingerDraw)return;
    e.preventDefault();
    const r=vp.getBoundingClientRect();
    touches.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
    vp.setPointerCapture?.(e.pointerId);
    if(touches.size===1){
      oneFinger={id:e.pointerId,startX:e.clientX,startY:e.clientY,startPanX:memoEditorPanX,startPanY:memoEditorPanY};
    }else if(touches.size>=2){
      oneFinger=null;
      const [a,b]=[...touches.values()];
      pinch={dist:Math.hypot(b.x-a.x,b.y-a.y)||1,scale:memoEditorScale,
        x:memoEditorPanX,y:memoEditorPanY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    }
  },{passive:false});
  vp.addEventListener("pointermove",e=>{
    if(e.pointerType!=="touch"||memoEditorFingerDraw||!touches.has(e.pointerId))return;
    e.preventDefault();
    const r=vp.getBoundingClientRect();
    touches.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
    if(touches.size>=2){
      if(!pinch){
        const [a,b]=[...touches.values()];
        pinch={dist:Math.hypot(b.x-a.x,b.y-a.y)||1,scale:memoEditorScale,
          x:memoEditorPanX,y:memoEditorPanY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
      }
      const [a,b]=[...touches.values()];
      const dist=Math.hypot(b.x-a.x,b.y-a.y)||1;
      const ns=Math.max(1,Math.min(4,pinch.scale*(dist/pinch.dist)));
      const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,ratio=ns/pinch.scale;
      memoEditorScale=ns;
      memoEditorPanX=cx-(pinch.cx-pinch.x)*ratio;
      memoEditorPanY=cy-(pinch.cy-pinch.y)*ratio;
      applyMemoEditorView();
    }else if(oneFinger&&oneFinger.id===e.pointerId){
      // 指1本は図面を縦に送る。Safariのページスクロールとは分離。
      memoEditorPanX=oneFinger.startPanX+(e.clientX-oneFinger.startX);
      memoEditorPanY=oneFinger.startPanY+(e.clientY-oneFinger.startY);
      const stage=$("#memoEditorStage"),vpH=vp.clientHeight,vpW=vp.clientWidth;
      const scaledH=(stage.scrollHeight||vpH)*memoEditorScale,scaledW=(stage.scrollWidth||vpW)*memoEditorScale;
      memoEditorPanY=Math.max(Math.min(0,vpH-scaledH),Math.min(0,memoEditorPanY));
      memoEditorPanX=Math.max(Math.min(0,vpW-scaledW),Math.min(0,memoEditorPanX));
      applyMemoEditorView();
    }
  },{passive:false});
  const end=e=>{
    if(e.pointerType!=="touch")return;
    touches.delete(e.pointerId);
    if(touches.size<2)pinch=null;
    if(!touches.size)oneFinger=null;
    else if(touches.size===1&&!memoEditorFingerDraw){
      const id=[...touches.keys()][0],pt=[...touches.values()][0];
      oneFinger={id,startX:pt.x,startY:pt.y,startPanX:memoEditorPanX,startPanY:memoEditorPanY};
    }
  };
  vp.addEventListener("pointerup",end);
  vp.addEventListener("pointercancel",end);
}
async function renderMemoEditorFile(){
  const f=memoEditorCurrent();if(!f)return;
  const token=++memoEditorRenderToken;
  clearMemoEditorUrls();resetMemoEditorView();
  const pages=$("#memoEditorPages");pages.innerHTML="";
  updateMemoEditorControls();
  const isPdf=f.isPdf||String(f.mimeType||"").toLowerCase()==="application/pdf";

  if(isPdf){
    try{
      if(!window.pdfjsLib)throw new Error("pdfjs not loaded");
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.blob.arrayBuffer())}).promise;
      for(let i=1;i<=pdf.numPages;i++){
        if(token!==memoEditorRenderToken)return;
        const pg=await pdf.getPage(i),base=pg.getViewport({scale:1});
        // 初期表示は「横幅いっぱい」ではなく、iPad横向きでも1ページ全体が見えるサイズにする。
        // 上下左右に少し余白を残し、必要な時だけピンチで拡大できる。
        const vp=$("#memoEditorViewport");
        const maxW=Math.max(100,(vp?.clientWidth||window.innerWidth)-28);
        const maxH=Math.max(100,(vp?.clientHeight||window.innerHeight)-28);
        const cssScale=Math.min(maxW/base.width,maxH/base.height);
        const view=pg.getViewport({scale:cssScale});
        const renderScale=cssScale*Math.min(2,devicePixelRatio||1);
        const renderView=pg.getViewport({scale:renderScale});
        const holder=document.createElement("div");holder.className="memo-editor-page";
        // PDF本体と手書きレイヤーを必ず同じページ座標系に固定する。
        holder.style.setProperty("width",Math.round(view.width)+"px","important");
        holder.style.setProperty("height",Math.round(view.height)+"px","important");
        holder.style.setProperty("max-width","none","important");
        const c=document.createElement("canvas");c.className="memo-editor-pdf-page";c.setAttribute("draggable","false");
        c.width=Math.ceil(renderView.width);c.height=Math.ceil(renderView.height);
        c.style.setProperty("width","100%","important");
        c.style.setProperty("height","100%","important");
        c.style.aspectRatio=`${view.width}/${view.height}`;
        await pg.render({canvasContext:c.getContext("2d"),viewport:renderView}).promise;
        holder.appendChild(c);
        const ink=document.createElement("canvas");ink.className="memo-editor-ink";
        holder.appendChild(ink);pages.appendChild(holder);
        editorBindInk(ink,f.id,i-1);
      }
    }catch(e){
      console.error(e);
      pages.innerHTML='<div class="memo-empty-files" style="padding:30px">PDFの表示に失敗しました</div>';
    }
  }else{
    const holder=document.createElement("div");holder.className="memo-editor-page memo-editor-image-page";
    const img=document.createElement("img");img.className="memo-editor-image";img.draggable=false;
    const url=URL.createObjectURL(f.blob);memoEditorUrls.push(url);img.src=url;
    holder.appendChild(img);
    const ink=document.createElement("canvas");ink.className="memo-editor-ink";
    holder.appendChild(ink);pages.appendChild(holder);
    img.onload=()=>{
      // 初期表示は画像全体が一画面に収まるようにする。
      const vp=$("#memoEditorViewport");
      const maxW=Math.max(100, (vp?.clientWidth||window.innerWidth)-20);
      const maxH=Math.max(100, (vp?.clientHeight||window.innerHeight)-20);
      const iw=Math.max(1,img.naturalWidth), ih=Math.max(1,img.naturalHeight);
      const fit=Math.min(maxW/iw,maxH/ih,1);
      const cssW=Math.max(1,Math.floor(iw*fit));
      const cssH=Math.max(1,Math.floor(ih*fit));
      holder.style.setProperty("width",cssW+"px","important");
      holder.style.setProperty("height",cssH+"px","important");
      holder.style.setProperty("max-width","none","important");
      holder.style.setProperty("min-height","0","important");
      img.style.setProperty("width","100%","important");
      img.style.setProperty("height","100%","important");
      img.style.setProperty("object-fit","contain","important");
      resetMemoEditorView();
      editorBindInk(ink,f.id,0);
    };
  }
  updateMemoEditorControls();
}
async function openMemoEditor(fileId){

async function moveMemoEditor(delta){

function undoMemoEditor(){
  const f=memoEditorCurrent();if(!f)return;
  const rec=memoEditorInkRec(f.id);
  for(let i=rec.pageStrokes.length-1;i>=0;i--){
    const arr=rec.pageStrokes[i];
    if(Array.isArray(arr)&&arr.length){
      const s=arr.pop();
      if(!Array.isArray(rec.pageRedo[i]))rec.pageRedo[i]=[];
      rec.pageRedo[i].push(s);
      persistMemoEditorInk(f.id);
      renderMemoEditorFile();
      return;
    }
  }
}
function redoMemoEditor(){
  const f=memoEditorCurrent();if(!f)return;
  const rec=memoEditorInkRec(f.id);
  for(let i=rec.pageRedo.length-1;i>=0;i--){
    const arr=rec.pageRedo[i];
    if(Array.isArray(arr)&&arr.length){
      const s=arr.pop();
      if(!Array.isArray(rec.pageStrokes[i]))rec.pageStrokes[i]=[];
      rec.pageStrokes[i].push(s);
      persistMemoEditorInk(f.id);
      renderMemoEditorFile();
      return;
    }
  }
}

async function drawMemoThumb(canvas,rec,isPdf){
  try{
    const box=canvas.parentElement.getBoundingClientRect();
    const dpr=Math.min(1.4,devicePixelRatio||1);
    const W=Math.max(280,Math.round((box.width||340)*dpr)),H=Math.max(210,Math.round((box.height||255)*dpr));
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");ctx.fillStyle="#d8d1cb";ctx.fillRect(0,0,W,H);
    let rx=0,ry=0,rw=W,rh=H;
    if(isPdf&&window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await rec.blob.arrayBuffer())}).promise;
      const pg=await pdf.getPage(1),base=pg.getViewport({scale:1});
      const s=Math.min(W/base.width,H/base.height),view=pg.getViewport({scale:s});
      rx=(W-view.width)/2;ry=(H-view.height)/2;rw=view.width;rh=view.height;
      ctx.save();ctx.translate(rx,ry);await pg.render({canvasContext:ctx,viewport:view}).promise;ctx.restore();
    }else if(!isPdf){
      const url=URL.createObjectURL(rec.blob);memoObjectUrls.push(url);
      const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=url});
      const s=Math.min(W/img.width,H/img.height);rw=img.width*s;rh=img.height*s;rx=(W-rw)/2;ry=(H-rh)/2;
      ctx.fillStyle="#fff";ctx.fillRect(rx,ry,rw,rh);ctx.drawImage(img,rx,ry,rw,rh);
    }
    const strokes=(memoEditorInkRec(rec.id).pageStrokes?.[0]||[]);
    if(strokes.length)editorCompositeStrokes(ctx,strokes,rx,ry,rw,rh);
  }catch(e){console.warn("thumb",e)}
}

      fn(e);
    };
    // iPad/Safariでも確実に反応するよう click を主軸にしつつ pointerup も併用。
    el.addEventListener("click",run,{passive:false});
    el.addEventListener("pointerup",run,{passive:false});
  };
  bindPreviewTap(closeBtn,()=>closeExportPdfPreview());
  bindPreviewTap($("#exportPdfPreviewPrev"),()=>{
    if(exportPdfPreviewIndex>0){exportPdfPreviewIndex--;renderExportPdfPreviewPage()}
  });
  bindPreviewTap($("#exportPdfPreviewNext"),()=>{
    if(exportPdfPreviewIndex<exportPdfPreviewImages.length-1){exportPdfPreviewIndex++;renderExportPdfPreviewPage()}
  });
  bindPreviewTap($("#exportPdfPreviewShare"),async()=>{
    if(!exportPdfPreviewFile)return;
    await shareOrDownloadFile(exportPdfPreviewFile,$("#exportPdfPreviewTitle").textContent||"現調 PDF");
  });
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",bindExportPdfPreviewControls,{once:true});
}else{
  bindExportPdfPreviewControls();
}
</script>
